name: defensin_figures
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R itself, pinned to the version the manuscript figures were actually rendered with
  - r-base=4.3.3
  - r-essentials
  - r-rmarkdown=2.29
  - r-knitr=1.49

  # single-cell processing (preprocessing/)
  - r-seurat=5.1.0
  - r-seuratobject=5.0.2
  - r-sctransform
  - r-hdf5r=1.3.11
  # glmGamPoi is not library()'d directly, but SCTransform(vst.flavor="v2")
  # (03_annotation_label_transfer.Rmd) uses it internally when present -
  # without it, SCTransform falls back to a much slower fit method
  - bioconductor-glmgampoi
  # same story for presto and FindAllMarkers (02_qc_clustering.Rmd) - not
  # on conda/Bioconductor, installed separately, see install_r_packages.R.
  # presto Depends on data.table (compiled, C+OpenMP) - installing it from
  # conda-forge as a binary here avoids relying on install.packages()/
  # devtools to compile it from source, which needs a full C/OpenMP
  # toolchain this trimmed env doesn't otherwise pull in and silently fails
  # with "had non-zero exit status" if that toolchain isn't present.
  - r-data.table

  # differential expression + gene set enrichment (differential_expression/)
  - bioconductor-deseq2=1.42.0
  - bioconductor-apeglm=1.24.0
  - r-ashr=2.2_63
  # tmod is not on conda/Bioconductor - installed separately, see install_r_packages.R

  # data wrangling / plotting used throughout preprocessing, DE, and figure Rmds
  - r-tidyverse=2.0.0
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-purrr=1.0.2
  - r-tibble=3.2.1
  - r-stringr=1.5.1
  - r-ggplot2=3.5.1
  - r-ggrepel=0.9.6
  - r-patchwork=1.3.0
  - r-rcolorbrewer=1.1_3
  - r-dt=0.33
  - r-devtools=2.4.5
  - r-xml

  # multi-sheet xlsx output (one sheet per figure panel)
  - r-openxlsx=4.2.7.1
